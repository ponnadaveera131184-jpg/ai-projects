
<!DOCTYPE html>
<html>
<head>
    <title>Practical 12 - Decision Tree</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Student Performance Prediction</h1>
    <h2>Decision Tree Classifier</h2>

    <form method="POST">

        <label>Study Hours Per Day:</label>
        <input type="number" name="study_hours"
               min="0" max="24" step="0.5"
               value="{{ study_hours }}" required>

        <label>Attendance Percentage:</label>
        <input type="number" name="attendance"
               min="0" max="100" step="0.1"
               value="{{ attendance }}" required>

        <label>Previous Marks:</label>
        <input type="number" name="previous_marks"
               min="0" max="100" step="0.1"
               value="{{ previous_marks }}" required>

        <button type="submit">Predict Performance</button>
    </form>

    {% if prediction %}
    <div class="result">
        <h2>Prediction Result</h2>
        <p>{{ prediction }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
