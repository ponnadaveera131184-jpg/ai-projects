
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Sentiment Analysis</h1>
    <p class="subtitle">AI-Based Text Emotion Classification</p>

    <form method="POST">
        <label>Enter Your Text:</label>

        <textarea name="text" rows="5"
                  placeholder="Write something here..."
                  required>{{ user_text }}</textarea>

        <button type="submit">Analyze Sentiment</button>
    </form>

    {% if sentiment %}
    <div class="result">
        <h2>Analysis Result</h2>

        <p class="sentiment">{{ sentiment }}</p>

        {% if confidence is not none %}
        <p>Model Confidence: {{ confidence }}%</p>
        {% endif %}
    </div>
    {% endif %}

    <div class="info">
        <p><strong>Algorithm:</strong> Multinomial Naive Bayes</p>
        <p><strong>Categories:</strong> Positive, Negative, Neutral</p>
    </div>
</div>

</body>
</html>
